[project]
site_name = "Home Assistant OS on Proxmox walkthrough"
site_description = "Home Assistant OS VM on Proxmox VE, from qcow2 to onboarding"
site_url = "https://home-assistant-os-proxmox-walkthrough.johna.kiwi/"
nav = [
  { "Overview" = "index.md" },
  { "What you need" = "prerequisites.md" },
  { "Download image" = "download.md" },
  { "Create VM" = "create-vm.md" },
  { "Import disk" = "import-disk.md" },
  { "Start and prove" = "prove-ui.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "References" = "references.md" },
]

[project.theme]
name = "patina"
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.png"
logo = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed" = { alternate_style = true }
toc.permalink = true
zensical.extensions.glightbox = { width = "95vw", height = "auto", zoomable = true }
