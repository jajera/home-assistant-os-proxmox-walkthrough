<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="Home Assistant OS on Proxmox walkthrough"
     font-family="Noto Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1c24"/>
      <stop offset="0.55" stop-color="#07141a"/>
      <stop offset="1" stop-color="#040a0e"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#18BCF2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#18BCF2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="920" cy="315" r="330" fill="url(#og-glow)"/>

  <!-- rack with house motif -->
  <g>
    <rect x="720" y="340" width="380" height="110" rx="14" fill="#102833" stroke="#18BCF2" stroke-width="3"/>
    <circle cx="762" cy="395" r="10" fill="#18BCF2"/>
    <path d="M800 395h240" stroke="#18BCF2" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <g stroke="#1e4250" stroke-width="3" stroke-linecap="round">
      <path d="M1050 365v60M1066 365v60M1082 365v60"/>
    </g>

    <path d="M910 150 L1090 280 H730 Z" fill="#18BCF2"/>
    <rect x="760" y="280" width="300" height="150" rx="10" fill="#41C9F5"/>
    <rect x="870" y="330" width="80" height="100" rx="6" fill="#0b1c24"/>
  </g>

  <text x="72" y="112" font-size="26" font-weight="700" letter-spacing="4" fill="#41C9F5">QCOW2 TO ONBOARDING</text>
  <text x="70" y="210" font-size="58" font-weight="700" fill="#f4f6f8">Home Assistant OS</text>
  <text x="70" y="285" font-size="58" font-weight="700" fill="#f4f6f8">on Proxmox</text>
  <text x="72" y="360" font-size="28" font-weight="400" fill="#c3cbd2">Official HAOS VM on a web-UI-ready host.</text>
  <text x="72" y="400" font-size="28" font-weight="400" fill="#c3cbd2">Consumes the Proxmox VE walkthrough.</text>
</svg>
