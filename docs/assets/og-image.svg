<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="Home Assistant OS on Proxmox walkthrough"
     font-family="Noto Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1c24"/>
      <stop offset="0.55" stop-color="#07141a"/>
      <stop offset="1" stop-color="#040a0e"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#18BCF2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#18BCF2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="910" cy="319" r="330" fill="url(#og-glow)"/>

  <!-- house above a rack; nothing overlaps -->
  <g>
    <path d="M910 130 L1100 262 H720 Z" fill="#18BCF2"/>
    <rect x="760" y="262" width="300" height="130" rx="10" fill="#41C9F5"/>
    <rect x="870" y="312" width="80" height="80" rx="6" fill="#0b1c24"/>

    <rect x="720" y="418" width="380" height="90" rx="14" fill="#102833" stroke="#18BCF2" stroke-width="3"/>
    <circle cx="762" cy="463" r="10" fill="#18BCF2"/>
    <path d="M800 463h220" stroke="#18BCF2" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <g stroke="#1e4250" stroke-width="3" stroke-linecap="round">
      <path d="M1050 438v50M1066 438v50M1082 438v50"/>
    </g>
  </g>

  <text x="72" y="182" font-size="26" font-weight="700" letter-spacing="4" fill="#41C9F5">QCOW2 TO ONBOARDING</text>
  <text x="70" y="280" font-size="58" font-weight="700" fill="#f4f6f8">Home Assistant OS</text>
  <text x="70" y="355" font-size="58" font-weight="700" fill="#f4f6f8">on Proxmox</text>
  <text x="72" y="430" font-size="28" font-weight="400" fill="#c3cbd2">Official HAOS VM on a web-UI-ready host.</text>
  <text x="72" y="470" font-size="28" font-weight="400" fill="#c3cbd2">Consumes the Proxmox VE walkthrough.</text>
</svg>
